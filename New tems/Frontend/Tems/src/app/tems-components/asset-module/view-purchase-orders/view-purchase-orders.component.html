<div class="bg-[#f5f5f7] dark:bg-[#1c1c1e] min-h-0 p-4 transition-colors duration-200">
  <div class="max-w-7xl mx-auto w-full">
    <div class="mb-4">
      <h1 class="text-2xl font-semibold text-gray-900 dark:text-white" style="letter-spacing: -0.5px;">Purchase Orders</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Browse active purchase orders and the assets linked to them.</p>
    </div>

    <section class="bg-white dark:bg-[#2c2c2e] rounded-xl border border-gray-200 dark:border-[#38383a] overflow-hidden">
      <ag-grid-angular
        class="w-full"
        [class]="gridThemeClass"
        style="height: min(58vh, calc(100dvh - 20rem)); min-height: 420px; width: 100%;"
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="50"
        [rowSelection]="'single'"
        [overlayNoRowsTemplate]="'<span class=\'ag-overlay-no-rows-center\'>No purchase orders found</span>'"
        (gridReady)="onGridReady($event)"
        (rowClicked)="onRowClicked($event)">
      </ag-grid-angular>
    </section>
  </div>
</div>

<app-purchase-order-preview-modal
  [show]="showPreviewModal"
  [purchaseOrder]="selectedPurchaseOrder"
  [canDelete]="canDeletePurchaseOrder(selectedPurchaseOrder)"
  (closed)="closePreviewModal()"
  (deleteRequested)="deleteSelectedPurchaseOrder()"
  (assetSelected)="openAsset($event)">
</app-purchase-order-preview-modal>
