<section class="tems-asset-page">
  <header class="tems-asset-header">
    <div>
      <h1 class="text-2xl font-semibold text-gray-900 dark:text-white" style="letter-spacing: -0.5px;">AI Support</h1>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Ask about equipment, tickets, troubleshooting, inventory, or anything else related to technical support. The assistant will stay focused on TEMS-related topics only.</p>
    </div>
  </header>

    <section class="tems-asset-card chat-window">
      <div class="chat-toolbar">
        <div class="chat-toolbar-left">
          <div class="message-avatar" aria-hidden="true">
            <i class="mdi mdi-chat-outline"></i>
          </div>
          <div class="chat-toolbar-label">
            <strong>TEMS AI Agent</strong>
            <span>Answers stay within technical support and equipment management.</span>
          </div>
        </div>
      </div>

      <div class="chat-history" #conversationViewport>
        <div
          *ngFor="let message of messages; trackBy: trackByMessageId"
          class="message-row"
          [class.user-row]="message.role === 'user'"
          [class.assistant-row]="message.role === 'assistant'">
          <div class="message-avatar">
            <i [class]="message.role === 'user' ? 'mdi mdi-account-outline' : 'mdi mdi-lifebuoy'"></i>
          </div>

          <div class="message-bubble" [class.is-streaming]="message.state === 'streaming'">
            <div
              class="chat-markdown"
              *ngIf="message.content; else typingState"
              [innerHTML]="renderMarkdown(message.content)"></div>

            <ng-template #typingState>
              <div class="typing-indicator" aria-label="AI is processing">
                <span></span>
                <span></span>
                <span></span>
              </div>
            </ng-template>
          </div>
        </div>

        <div *ngIf="isProcessing" class="processing-banner">
          <span class="processing-dot"></span>
          <span>AI is thinking...</span>
        </div>
      </div>

      <footer class="composer-shell">
        <textarea
          [(ngModel)]="draftMessage"
          (keydown)="onComposerKeydown($event)"
          [disabled]="isProcessing"
          rows="2"
          placeholder="Type your question here..."
          class="composer-input"></textarea>

        <button
          type="button"
          class="composer-send"
          (click)="sendMessage()"
          [disabled]="isProcessing || !draftMessage.trim()">
          <i class="mdi mdi-send"></i>
          <span>Send</span>
        </button>
      </footer>
    </section>
  </section>
