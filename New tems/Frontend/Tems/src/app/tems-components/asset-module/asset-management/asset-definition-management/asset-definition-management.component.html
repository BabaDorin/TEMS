<section class="tems-asset-page">
  <header class="tems-asset-header">
    <div>
      <div class="tems-asset-eyebrow">
        <i class="mdi mdi-file-document-outline"></i>
        <span>Asset Definitions</span>
      </div>
      <h2 class="text-2xl">Create asset records from reusable types</h2>
      <p>Definitions combine a type with real device metadata and inventory data.</p>
    </div>

    <button type="button" (click)="openCreateModal()" class="tems-btn tems-btn-primary">
      <i class="mdi mdi-plus"></i>
      <span>Create definition</span>
    </button>
  </header>

  <section class="tems-asset-card">
    <div class="tems-asset-grid-shell" [ngClass]="gridThemeClass">
      <ag-grid-angular
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="20"
        (gridReady)="onGridReady($event)"
        class="w-full h-full">
      </ag-grid-angular>
    </div>
  </section>
</section>
