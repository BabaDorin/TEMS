<section class="tems-asset-page">
  <header class="tems-asset-header">
    <div>
      <div class="tems-asset-eyebrow">
        <i class="mdi mdi-shape-outline"></i>
        <span>Asset Types</span>
      </div>
      <h2 class="text-2xl">Group properties into reusable device families</h2>
      <p>Types define how assets inherit structure, validation, and relationships.</p>
    </div>

    <button type="button" (click)="openCreateModal()" class="tems-btn tems-btn-primary">
      <i class="mdi mdi-plus"></i>
      <span>Create type</span>
    </button>
  </header>

  <section class="tems-asset-card">
    <div class="tems-asset-grid-shell" [ngClass]="gridThemeClass">
      <ag-grid-angular
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="20"
        (gridReady)="onGridReady($event)"
        class="w-full h-full">
      </ag-grid-angular>
    </div>
  </section>

  <div *ngIf="showEditModal" class="tems-asset-modal-backdrop" (click)="closeEditModal()">
    <div class="tems-asset-dialog tems-asset-modal-card" (click)="$event.stopPropagation()">
      <div class="tems-asset-modal-header">
        <div>
          <h3 class="text-lg font-semibold m-0 text-[color:var(--text-primary)]">Edit asset type</h3>
          <p class="tems-asset-help mt-1">Adjust the type structure, parent type, and property mapping.</p>
        </div>
      </div>

      <form [formGroup]="editForm" (ngSubmit)="updateType()" class="tems-asset-modal-body">
        <div class="tems-asset-section">
          <div class="tems-asset-field">
            <label>Name *</label>
            <input type="text" formControlName="name" class="tems-asset-input">
          </div>

          <div class="tems-asset-field">
            <label>Description</label>
            <textarea formControlName="description" rows="2" class="tems-asset-textarea"></textarea>
          </div>

          <div class="tems-asset-field">
            <label>Parent type</label>
            <select formControlName="parentTypeId" class="tems-asset-select">
              <option value="">None (Root type)</option>
              <option *ngFor="let type of parentTypes" [value]="type.id">{{ type.name }}</option>
            </select>
          </div>
        </div>

        <div class="tems-asset-section mt-6">
          <div class="flex items-center justify-between gap-3">
            <div>
              <p class="tems-asset-label m-0">Properties</p>
              <p class="tems-asset-help m-0">Pick the fields this type should expose.</p>
            </div>
            <button type="button" (click)="addPropertyToEdit()" class="tems-btn tems-btn-secondary">
              <i class="mdi mdi-plus"></i>
              <span>Add property</span>
            </button>
          </div>

          <div *ngIf="editSelectedProperties.length === 0" class="tems-asset-empty">
            No properties added yet.
          </div>

          <div class="tems-asset-grid" *ngIf="editSelectedProperties.length > 0">
            <div *ngFor="let prop of editSelectedProperties.controls; let i = index" [formGroup]="$any(prop)"
              class="rounded-[1.15rem] border border-[color:var(--border-secondary)] bg-[color:var(--bg-secondary)] p-4">
              <div class="grid grid-cols-12 gap-3">
                <div class="col-span-5">
                  <label class="tems-asset-label text-xs">Property</label>
                  <select formControlName="propertyId" class="tems-asset-select mt-1">
                    <option value="">Select property</option>
                    <option *ngFor="let p of availableProperties" [value]="p.id">{{ p.name }}</option>
                  </select>
                </div>
                <div class="col-span-2 flex items-end">
                  <label class="inline-flex items-center gap-2 text-sm text-[color:var(--text-secondary)]">
                    <input type="checkbox" formControlName="isRequired">
                    Required
                  </label>
                </div>
                <div class="col-span-2">
                  <label class="tems-asset-label text-xs">Order</label>
                  <input type="number" formControlName="displayOrder" class="tems-asset-input mt-1">
                </div>
                <div class="col-span-2">
                  <label class="tems-asset-label text-xs">Default</label>
                  <input type="text" formControlName="defaultValue" class="tems-asset-input mt-1">
                </div>
                <div class="col-span-1 flex items-end justify-end">
                  <button type="button" (click)="removePropertyFromEdit(i)" class="tems-asset-cell-action tems-asset-cell-action--danger">
                    <i class="mdi mdi-close"></i>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <footer class="tems-asset-modal-footer">
          <button type="button" (click)="closeEditModal()" class="tems-btn tems-btn-secondary">Cancel</button>
          <button type="submit" [disabled]="editForm.invalid || isSubmitting" class="tems-btn tems-btn-primary">
            {{ isSubmitting ? 'Updating...' : 'Update' }}
          </button>
        </footer>
      </form>
    </div>
  </div>
</section>
