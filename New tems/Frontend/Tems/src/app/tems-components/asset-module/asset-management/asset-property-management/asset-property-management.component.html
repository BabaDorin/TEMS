<section class="tems-asset-page">
  <header class="tems-asset-header">
    <div>
      <div class="tems-asset-eyebrow">
        <i class="mdi mdi-tag-text-outline"></i>
        <span>Asset Properties</span>
      </div>
      <h2 class="text-2xl">Define reusable technical fields</h2>
      <p>Use properties to keep hardware metadata consistent across types and definitions.</p>
    </div>

    <button type="button" (click)="openCreateModal()" class="tems-btn tems-btn-primary">
      <i class="mdi mdi-plus"></i>
      <span>Create property</span>
    </button>
  </header>

  <section class="tems-asset-card">
    <div class="tems-asset-grid-shell ag-grid-host" [ngClass]="gridThemeClass">
      <ag-grid-angular
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="20"
        (gridReady)="onGridReady($event)"
        class="w-full h-full">
      </ag-grid-angular>
    </div>
  </section>

  <div *ngIf="showCreateModal" class="tems-asset-modal-backdrop" (click)="closeCreateModal()">
    <div class="tems-asset-dialog tems-asset-modal-card tems-asset-modal-card--narrow" (click)="$event.stopPropagation()">
      <div class="tems-asset-modal-header">
        <div>
          <h3 class="text-lg font-semibold m-0 text-[color:var(--text-primary)]">Create asset property</h3>
          <p class="tems-asset-help mt-1">Set the field name, type, and optional metadata.</p>
        </div>
      </div>

      <form [formGroup]="createForm" (ngSubmit)="createProperty()" class="tems-asset-modal-body">
        <div class="tems-asset-grid tems-asset-grid--two">
          <div class="tems-asset-field col-span-2">
            <label>Name *</label>
            <input type="text" formControlName="name" class="tems-asset-input">
          </div>

          <div class="tems-asset-field">
            <label>Category *</label>
            <input type="text" formControlName="category" class="tems-asset-input">
          </div>

          <div class="tems-asset-field">
            <label>Data type *</label>
            <select formControlName="dataType" class="tems-asset-select">
              <option *ngFor="let type of dataTypes" [value]="type.value">{{ type.label }}</option>
            </select>
          </div>

          <div class="tems-asset-field">
            <label>Unit</label>
            <input type="text" formControlName="unit" placeholder="e.g. GB, MHz, inches" class="tems-asset-input">
          </div>

          <div class="tems-asset-field">
            <label>Enum values</label>
            <input type="text" formControlName="enumValues" placeholder="Red, Green, Blue" class="tems-asset-input">
          </div>

          <div class="tems-asset-field col-span-2">
            <label>Description</label>
            <textarea formControlName="description" rows="3" class="tems-asset-textarea"></textarea>
          </div>
        </div>

        <footer class="tems-asset-modal-footer">
          <button type="button" (click)="closeCreateModal()" class="tems-btn tems-btn-secondary">Cancel</button>
          <button type="submit" [disabled]="createForm.invalid || isSubmitting" class="tems-btn tems-btn-primary">
            {{ isSubmitting ? 'Creating...' : 'Create' }}
          </button>
        </footer>
      </form>
    </div>
  </div>

  <div *ngIf="showEditModal" class="tems-asset-modal-backdrop" (click)="closeEditModal()">
    <div class="tems-asset-dialog tems-asset-modal-card tems-asset-modal-card--narrow" (click)="$event.stopPropagation()">
      <div class="tems-asset-modal-header">
        <div>
          <h3 class="text-lg font-semibold m-0 text-[color:var(--text-primary)]">Edit asset property</h3>
          <p class="tems-asset-help mt-1">Update the field details while keeping existing asset usage intact.</p>
        </div>
      </div>

      <form [formGroup]="editForm" (ngSubmit)="updateProperty()" class="tems-asset-modal-body">
        <div class="tems-asset-grid tems-asset-grid--two">
          <div class="tems-asset-field col-span-2">
            <label>Name *</label>
            <input type="text" formControlName="name" class="tems-asset-input">
          </div>

          <div class="tems-asset-field">
            <label>Category *</label>
            <input type="text" formControlName="category" class="tems-asset-input">
          </div>

          <div class="tems-asset-field">
            <label>Data type *</label>
            <select formControlName="dataType" class="tems-asset-select">
              <option *ngFor="let type of dataTypes" [value]="type.value">{{ type.label }}</option>
            </select>
          </div>

          <div class="tems-asset-field">
            <label>Unit</label>
            <input type="text" formControlName="unit" placeholder="e.g. GB, MHz, inches" class="tems-asset-input">
          </div>

          <div class="tems-asset-field">
            <label>Enum values</label>
            <input type="text" formControlName="enumValues" placeholder="Red, Green, Blue" class="tems-asset-input">
          </div>

          <div class="tems-asset-field col-span-2">
            <label>Description</label>
            <textarea formControlName="description" rows="3" class="tems-asset-textarea"></textarea>
          </div>
        </div>

        <footer class="tems-asset-modal-footer">
          <button type="button" (click)="closeEditModal()" class="tems-btn tems-btn-secondary">Cancel</button>
          <button type="submit" [disabled]="editForm.invalid || isSubmitting" class="tems-btn tems-btn-primary">
            {{ isSubmitting ? 'Updating...' : 'Update' }}
          </button>
        </footer>
      </form>
    </div>
  </div>
</section>
