<div class="tems-modal-panel max-w-lg w-full mx-auto">
  <div class="tems-modal-header flex items-center justify-between">
    <div>
      <h2 class="text-lg font-semibold text-gray-900 dark:text-white m-0">{{ title }}</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 m-0 mt-0.5">{{ assets.length }} selected asset(s)</p>
    </div>
    <button
      (click)="close()"
      class="p-2 hover:bg-gray-100 dark:hover:bg-white/10 rounded-lg transition">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" class="text-gray-500 dark:text-gray-400">
        <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="tems-modal-body space-y-4">
    <div>
      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
        {{ mode === 'user' ? 'Select User' : 'Select Room' }}
      </label>
      <app-custom-select
        [options]="options"
        [(ngModel)]="selectedTargetId"
        (ngModelChange)="onTargetChange($event)"
        (searchTextChange)="onTargetSearchChange($event)"
        [loading]="loading"
        [mode]="'single'"
        [searchable]="true"
        [allowEmpty]="false"
        [placeholder]="mode === 'user' ? 'Search users by name...' : 'Search rooms...'">
      </app-custom-select>
    </div>

    <p *ngIf="errorMessage" class="text-sm text-red-600 dark:text-red-400 m-0">{{ errorMessage }}</p>
  </div>

  <div class="tems-modal-footer">
    <button
      (click)="close()"
      [disabled]="submitting"
      class="tems-btn tems-btn-secondary disabled:opacity-50">
      Cancel
    </button>
    <button
      (click)="submit()"
      [disabled]="loading || !selectedTargetId || submitting"
      class="tems-btn tems-btn-primary disabled:opacity-50 disabled:cursor-not-allowed">
      {{ submitLabel }}
    </button>
  </div>
</div>
