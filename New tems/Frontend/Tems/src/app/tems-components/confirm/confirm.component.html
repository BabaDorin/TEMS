<div class="tems-modal-panel max-w-md w-full mx-auto">
  <div class="tems-modal-header">
    <div class="flex items-start justify-between gap-4">
      <div class="flex-1">
        <h2 class="text-lg font-semibold text-gray-900 dark:text-white m-0">
          Confirm
        </h2>
      </div>
      <button
        type="button"
        (click)="cancel()"
        class="p-2 rounded-full hover:bg-gray-100 dark:hover:bg-white/10 transition"
        aria-label="Close dialog">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" class="text-gray-500 dark:text-gray-400">
          <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="tems-modal-body">
    <p class="text-sm text-gray-700 dark:text-gray-300 m-0">
      {{ message }}
    </p>
  </div>

  <div class="tems-modal-footer">
    <button mat-button (click)="cancel()" class="tems-btn tems-btn-secondary">
      {{ cancelButtonText }}
    </button>
    <button mat-button (click)="ok()" class="tems-btn tems-btn-primary">
      {{ confirmButtonText }}
    </button>
  </div>
</div>
