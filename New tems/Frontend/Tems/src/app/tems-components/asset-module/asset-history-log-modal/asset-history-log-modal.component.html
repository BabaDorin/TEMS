<div class="tems-modal-panel max-w-2xl w-full mx-auto">
  <div class="tems-modal-header flex items-center justify-between gap-4">
    <div>
      <h2 class="text-lg font-semibold text-gray-900 dark:text-white m-0">Add New Log</h2>
      <p class="text-sm text-gray-500 dark:text-gray-400 m-0 mt-0.5">Create a manual history entry for this asset</p>
    </div>
    <button
      (click)="close()"
      class="p-2 hover:bg-gray-100 dark:hover:bg-white/10 rounded-lg transition">
      <svg width="18" height="18" viewBox="0 0 20 20" fill="none" class="text-gray-500 dark:text-gray-400">
        <path d="M15 5L5 15M5 5L15 15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

  <div class="tems-modal-body space-y-5">
    <div class="bg-gray-50 dark:bg-[#3a3a3c] rounded-lg p-4 border border-gray-200 dark:border-[#48484a]">
      <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wide m-0">Asset</p>
      <p class="text-sm font-semibold text-gray-900 dark:text-white mt-1 mb-0">
        {{ data?.assetTag || 'Selected asset' }}
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-[minmax(0,1fr)_2fr] gap-5">
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Log type</label>
        <app-custom-select
          [options]="typeOptions"
          [(ngModel)]="selectedType"
          [mode]="'single'"
          [searchable]="false"
          [allowEmpty]="false"
          [placeholder]="'Select log type'">
        </app-custom-select>
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Description</label>
        <textarea
          [(ngModel)]="description"
          rows="5"
          maxlength="400"
          placeholder="Describe the change, work performed, or context behind this log entry"
          class="w-full px-3 py-2.5 text-sm bg-white dark:bg-[#3a3a3c] text-gray-900 dark:text-white border border-gray-200 dark:border-[#48484a] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#007aff]/20 focus:border-[#007aff] transition resize-none">
        </textarea>
        <div class="flex items-center justify-between mt-1">
          <p class="text-xs text-gray-500 dark:text-gray-400 m-0">Maximum 400 characters</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 m-0">{{ remainingChars }} characters left</p>
        </div>
      </div>
    </div>

    <div class="flex flex-col md:flex-row md:items-end gap-3">
      <label class="inline-flex items-center gap-2 text-sm text-gray-700 dark:text-gray-300 md:min-w-fit h-11">
        <input
          type="checkbox"
          [(ngModel)]="costIncluded"
          (ngModelChange)="onCostIncludedChange()"
          class="h-4 w-4 rounded border-gray-300 text-[#007aff] focus:ring-[#007aff]">
        <span>Cost included</span>
      </label>

      <div class="flex-1 grid grid-cols-[minmax(0,1fr)_120px] gap-3">
        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Amount</label>
          <input
            type="number"
            min="0"
            step="0.01"
            [(ngModel)]="costAmount"
            [disabled]="!costIncluded"
            placeholder="0.00"
            class="w-full h-[44px] px-3 text-sm bg-white dark:bg-[#3a3a3c] text-gray-900 dark:text-white border border-gray-200 dark:border-[#48484a] rounded-xl focus:outline-none focus:ring-2 focus:ring-[#007aff]/20 focus:border-[#007aff] transition disabled:opacity-50 disabled:cursor-not-allowed">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">Currency</label>
          <app-custom-select
            [options]="currencyOptions"
            [(ngModel)]="costCurrency"
            [mode]="'single'"
            [searchable]="false"
            [allowEmpty]="false"
            [disabled]="!costIncluded"
            [placeholder]="'Currency'">
          </app-custom-select>
        </div>
      </div>
    </div>

    <div *ngIf="error" class="p-3 rounded-lg border border-red-200 bg-red-50 dark:bg-red-900/20 dark:border-red-700/50">
      <p class="text-sm text-red-600 dark:text-red-400 m-0">{{ error }}</p>
    </div>
  </div>

  <div class="tems-modal-footer">
    <button
      type="button"
      (click)="close()"
      [disabled]="isSaving"
      class="tems-btn tems-btn-secondary disabled:opacity-50">
      Cancel
    </button>
    <button
      type="button"
      (click)="save()"
      [disabled]="!canSave() || isSaving"
      class="tems-btn tems-btn-primary disabled:opacity-50 disabled:cursor-not-allowed inline-flex items-center gap-2">
      <svg *ngIf="isSaving" class="animate-spin h-4 w-4" viewBox="0 0 24 24">
        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" fill="none"></circle>
        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
      </svg>
      <span>{{ isSaving ? 'Saving...' : 'Save Log' }}</span>
    </button>
  </div>
</div>
