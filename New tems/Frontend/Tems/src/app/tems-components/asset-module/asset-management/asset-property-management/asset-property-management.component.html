<section class="tems-asset-page">
  <header class="tems-asset-header m-1 border-0 shadow-none">
    <div>
      <h2 class="text-2xl">Define reusable technical fields</h2>
      <p>Use properties to keep hardware metadata consistent across types and definitions.</p>
    </div>

    <button type="button" (click)="openCreateModal()" class="tems-asset-link-button">
      <i class="mdi mdi-plus"></i>
      <span>Add new property</span>
    </button>
  </header>

  <section class="tems-asset-card">
    <div class="tems-asset-grid-shell ag-grid-host" [ngClass]="gridThemeClass">
      <ag-grid-angular
        [rowData]="rowData"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [pagination]="true"
        [paginationPageSize]="20"
        (gridReady)="onGridReady($event)"
        class="w-full h-full">
      </ag-grid-angular>
    </div>
  </section>

  <div *ngIf="showCreateModal" class="tems-asset-modal-backdrop" (click)="closeCreateModal()">
    <div class="tems-asset-dialog tems-asset-modal-card tems-asset-modal-card--narrow asset-admin-modal bg-white dark:bg-[#2c2c2e] rounded-lg shadow-xl my-8" (click)="$event.stopPropagation()">
      <div class="asset-admin-modal__header">
        <div>
          <h2 class="text-xl font-semibold text-gray-900 dark:text-white m-0">Create Asset Property</h2>
          <p class="asset-admin-modal__subtitle">Set the field name, type, and optional metadata.</p>
        </div>
        <button type="button" (click)="closeCreateModal()" aria-label="Close" class="asset-admin-modal__close">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form [formGroup]="createForm" (ngSubmit)="createProperty()" class="asset-admin-modal__form">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="asset-admin-modal__field sm:col-span-2">
            <label class="asset-admin-modal__label">Name *</label>
            <input type="text" formControlName="name" class="asset-admin-modal__input">
          </div>

          <div class="asset-admin-modal__field">
            <label class="asset-admin-modal__label">Category *</label>
            <input type="text" formControlName="category" class="asset-admin-modal__input">
          </div>

          <div class="asset-admin-modal__field">
            <label class="asset-admin-modal__label">Data type *</label>
            <select formControlName="dataType" class="asset-admin-modal__input">
              <option *ngFor="let type of dataTypes" [value]="type.value">{{ type.label }}</option>
            </select>
          </div>

          <div class="asset-admin-modal__field">
            <label class="asset-admin-modal__label">Unit</label>
            <input type="text" formControlName="unit" placeholder="e.g. GB, MHz, inches" class="asset-admin-modal__input">
          </div>

          <div class="asset-admin-modal__field">
            <label class="asset-admin-modal__label">Enum values</label>
            <input type="text" formControlName="enumValues" placeholder="Red, Green, Blue" class="asset-admin-modal__input">
          </div>

          <div class="asset-admin-modal__field sm:col-span-2">
            <label class="asset-admin-modal__label">Description</label>
            <textarea formControlName="description" rows="4" class="asset-admin-modal__input asset-admin-modal__textarea"></textarea>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <button type="button" (click)="closeCreateModal()" class="tems-btn tems-btn-secondary flex-1">Cancel</button>
          <button type="submit" [disabled]="createForm.invalid || isSubmitting" class="tems-btn tems-btn-primary flex-1">
            {{ isSubmitting ? 'Creating...' : 'Create' }}
          </button>
        </div>
      </form>
    </div>
  </div>

  <div *ngIf="showEditModal" class="tems-asset-modal-backdrop" (click)="closeEditModal()">
    <div class="tems-asset-dialog tems-asset-modal-card tems-asset-modal-card--narrow asset-admin-modal bg-white dark:bg-[#2c2c2e] rounded-lg shadow-xl my-8" (click)="$event.stopPropagation()">
      <div class="asset-admin-modal__header">
        <div>
          <h2 class="text-xl font-semibold text-gray-900 dark:text-white m-0">Edit Asset Property</h2>
          <p class="asset-admin-modal__subtitle">Update the field details while keeping existing asset usage intact.</p>
        </div>
        <button type="button" (click)="closeEditModal()" aria-label="Close" class="asset-admin-modal__close">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>

      <form [formGroup]="editForm" (ngSubmit)="updateProperty()" class="asset-admin-modal__form">
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
          <div class="asset-admin-modal__field sm:col-span-2">
            <label class="asset-admin-modal__label">Name *</label>
            <input type="text" formControlName="name" class="asset-admin-modal__input">
          </div>

          <div class="asset-admin-modal__field">
            <label class="asset-admin-modal__label">Category *</label>
            <input type="text" formControlName="category" class="asset-admin-modal__input">
          </div>

          <div class="asset-admin-modal__field">
            <label class="asset-admin-modal__label">Data type *</label>
            <select formControlName="dataType" class="asset-admin-modal__input">
              <option *ngFor="let type of dataTypes" [value]="type.value">{{ type.label }}</option>
            </select>
          </div>

          <div class="asset-admin-modal__field">
            <label class="asset-admin-modal__label">Unit</label>
            <input type="text" formControlName="unit" placeholder="e.g. GB, MHz, inches" class="asset-admin-modal__input">
          </div>

          <div class="asset-admin-modal__field">
            <label class="asset-admin-modal__label">Enum values</label>
            <input type="text" formControlName="enumValues" placeholder="Red, Green, Blue" class="asset-admin-modal__input">
          </div>

          <div class="asset-admin-modal__field sm:col-span-2">
            <label class="asset-admin-modal__label">Description</label>
            <textarea formControlName="description" rows="4" class="asset-admin-modal__input asset-admin-modal__textarea"></textarea>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-3 pt-2">
          <button type="button" (click)="closeEditModal()" class="tems-btn tems-btn-secondary flex-1">Cancel</button>
          <button type="submit" [disabled]="editForm.invalid || isSubmitting" class="tems-btn tems-btn-primary flex-1">
            {{ isSubmitting ? 'Updating...' : 'Update' }}
          </button>
        </div>
      </form>
    </div>
  </div>
</section>
