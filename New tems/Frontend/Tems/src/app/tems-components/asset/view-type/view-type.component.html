<div [ngClass]="dialogRef == undefined ? 'tems-asset-dialog tems-asset-modal-card' : 'tems-asset-dialog tems-asset-modal-card'">
  <div class="tems-asset-modal-header">
    <div>
      <div class="tems-asset-eyebrow">
        <i class="mdi mdi-shape-outline"></i>
        <span>Type</span>
      </div>
      <h2 class="text-xl font-semibold text-[color:var(--text-primary)] m-0 mt-2">{{ type.name }}</h2>
      <p class="tems-asset-help mt-1">Type hierarchy and linked properties.</p>
    </div>
  </div>

  <div class="tems-asset-modal-body">
    <div class="tems-asset-section">
      <div *ngIf="type.parents != undefined && type.parents.length > 0" class="tems-asset-section">
        <span class="tems-asset-label">{{ 'entities.parentTypes' | translate }}</span>
        <div class="flex flex-wrap gap-2">
          <button type="button" *ngFor="let parent of type.parents" (click)="viewType(parent.value)" class="tems-btn tems-btn-secondary">
            {{ parent.label }}
          </button>
        </div>
      </div>

      <div *ngIf="type.children != undefined && type.children.length > 0" class="tems-asset-section">
        <span class="tems-asset-label">{{ 'entities.childTypes' | translate }}</span>
        <div class="flex flex-wrap gap-2">
          <button type="button" *ngFor="let child of type.children" (click)="viewType(child.id)" class="tems-btn tems-btn-secondary">
            {{ child.name }}
          </button>
        </div>
      </div>

      <div *ngIf="type.properties != undefined && type.properties.length > 0" class="tems-asset-section">
        <span class="tems-asset-label">{{ 'entities.properties' | translate }}</span>
        <div class="flex flex-wrap gap-2">
          <button type="button" *ngFor="let property of type.properties" (click)="viewProperty(property.id)" class="tems-btn tems-btn-secondary">
            {{ property.displayName }}
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
